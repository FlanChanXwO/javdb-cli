# Localized content: English / 中文
name: Feature request / 功能请求
description: Propose a focused improvement to javdb-cli. / 为 javdb-cli 提出明确的改进建议。
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        English: Please describe the user problem first. Do not include passwords, JWTs, private URLs, or private API responses.
        中文：请先描述用户问题。不要包含密码、JWT、私有 URL 或私有 API 响应。

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / 要解决的问题
      description: Explain the concrete workflow or limitation that motivates this request. / 请说明促使你提出此请求的具体流程或限制。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 建议的行为
      description: Describe the desired CLI, SDK, or documentation behavior. Include examples when useful. / 请描述期望的 CLI、SDK 或文档行为；适当时附上示例。
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected interface / 受影响的接口
      description: Select every interface that should expose the change. / 请选择应提供此变更的所有接口。
      multiple: true
      options:
        - CLI
        - Public Go SDK
        - Authentication or account management / 认证或账号管理
        - Magnets, rankings, TOP250, or user lists / 磁力、榜单、TOP250 或用户列表
        - Release installer or self-update / 发布安装器或自更新
        - Operator skill (skills/javdb-cli) / Operator skill（skills/javdb-cli）
        - Documentation / 文档
        - Other / 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 已考虑的替代方案
      description: Describe existing commands, workarounds, or other designs you considered. / 请说明已考虑的现有命令、变通方案或其他设计。
      render: text

  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility / 兼容性
      options:
        - label: This proposal may require a breaking CLI, SDK, configuration, or output-contract change. / 此提案可能需要破坏性变更 CLI、SDK、配置或输出契约。
          required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation / 安全确认
      options:
        - label: I have not included secrets or private content in this request. / 我没有在此请求中包含密钥或私密内容。
          required: true
