name: Quality gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  scope:
    name: Classify change scope
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      quality_required: ${{ steps.scope.outputs.quality_required }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
      - name: Classify change scope
        id: scope
        shell: bash
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            printf '%s\n' 'quality_required=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pull/$PR/head"
          test "$(git rev-parse "refs/remotes/pull/$PR/head")" = "$HEAD_SHA"
          bash ./scripts/classify-change-scope.sh --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  quality_gate:
    name: Quality gate
    needs: scope
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.quality_required == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require successful scope classification
        if: ${{ needs.scope.result != 'success' }}
        shell: bash
        run: |
          echo '::error::Change-scope classification failed.'
          exit 1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: ${{ needs.scope.result == 'success' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: ${{ needs.scope.result == 'success' }}
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        if: ${{ needs.scope.result == 'success' }}
        shell: bash
        run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"

      - name: Test
        if: ${{ needs.scope.result == 'success' }}
        shell: bash
        run: go test ./... -count=1

      - name: Test with race detector
        if: ${{ needs.scope.result == 'success' }}
        shell: bash
        run: go test -race ./... -count=1

      - name: Vet
        if: ${{ needs.scope.result == 'success' }}
        shell: bash
        run: go vet ./...

      - name: Build local binary
        if: ${{ needs.scope.result == 'success' }}
        shell: bash
        run: sh scripts/build.sh

      - name: Version smoke
        if: ${{ needs.scope.result == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ./build/javdb --version | tee /tmp/javdb-version.txt
          grep -F 'javdb version' /tmp/javdb-version.txt >/dev/null

      - name: Test release packaging and workflow policy
        if: ${{ needs.scope.result == 'success' }}
        shell: bash
        run: |
          sh scripts/test-package-release.sh
          sh scripts/test-build-platform.sh
          sh scripts/test-homebrew-formula.sh
          sh scripts/test-workflows.sh
          sh scripts/test-releasenotes.sh
