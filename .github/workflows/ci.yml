name: Quality gate

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch: {}

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # 仅允许严格的文档白名单跳过代码质量门禁；其他任何改动均运行完整质量检查。
  quality_gate:
    name: Quality gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/classify-change-scope
        id: scope
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Check Go formatting
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"

      - name: Test
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: go test ./... -count=1

      - name: Test with race detector
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: go test -race ./... -count=1

      - name: Vet
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: go vet ./...

      - name: Build local binary
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: sh scripts/build.sh

      - name: Version smoke
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ./build/javdb --version | tee /tmp/javdb-version.txt
          grep -F 'javdb version' /tmp/javdb-version.txt >/dev/null

      - name: Test release packaging and workflow policy
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: |
          sh scripts/test-package-release.sh
          sh scripts/test-build-platform.sh
          sh scripts/test-homebrew-formula.sh
          sh scripts/test-workflows.sh
          sh scripts/test-releasenotes.sh

  platform_smoke_gate:
    if: ${{ github.event_name == 'pull_request' }}
    name: Platform smoke gate
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull request head
        shell: bash
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pull/$PR/head"
          test "$(git rev-parse "refs/remotes/pull/$PR/head")" = "$HEAD_SHA"

      - uses: ./.github/actions/classify-change-scope
        id: scope
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Explain skipped platform smoke
        if: ${{ steps.scope.outputs.platform_required != 'true' }}
        shell: bash
        run: |
          echo '::notice title=Platform smoke::Not required for this documentation-only change.'
          printf '%s\n' '### Platform smoke' '' 'Not required for this documentation-only change.' >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch parallel platform workers
        if: ${{ steps.scope.outputs.platform_required == 'true' }}
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          worker_ref="$DEFAULT_BRANCH"
          if ! grep -Fx 'name: Platform smoke workers' .github/workflows/platform-smoke.yml >/dev/null; then
            worker_ref='ci/smoke-worker-bootstrap'
          fi
          payload=$(jq -nc \
            --arg ref "$worker_ref" \
            --arg pr_number "$PR" \
            --arg head_sha "$HEAD_SHA" \
            '{ref:$ref, return_run_details:true, inputs:{pr_number:$pr_number, head_sha:$head_sha}}')
          response=$(gh api --method POST \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPO/actions/workflows/platform-smoke.yml/dispatches" \
            --input - <<<"$payload")
          run_id=$(printf '%s' "$response" | jq -r '.workflow_run_id')
          test -n "$run_id"
          test "$run_id" != null
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Require all platform workers
        if: ${{ steps.scope.outputs.platform_required == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$RUN_ID"
          if gh run watch "$RUN_ID" --repo "$REPO" --exit-status; then
            echo '::notice title=Platform smoke::All required native platforms passed.'
            printf '%s\n' '### Platform smoke' '' 'All required native platforms passed in parallel.' '' "Worker run: $run_url" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          failures=$(gh api --method GET "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            -f filter=all \
            -f per_page=100 \
            --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | "\(.name) (\(.conclusion // .status))"')
          [ -n "$failures" ] || failures='worker workflow did not finish successfully'
          message=$(printf '%s\n' "$failures" | paste -sd ';' -)
          echo "::error title=Platform smoke failed::$message"
          {
            printf '%s\n' '### Platform smoke failed' ''
            printf '%s\n' "$failures" | sed 's/^/- /'
            printf '\nWorker run: %s\n' "$run_url"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  container_smoke_gate:
    if: ${{ github.event_name == 'pull_request' }}
    name: Container smoke gate
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull request head
        shell: bash
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pull/$PR/head"
          test "$(git rev-parse "refs/remotes/pull/$PR/head")" = "$HEAD_SHA"

      - uses: ./.github/actions/classify-change-scope
        id: scope
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Explain skipped container smoke
        if: ${{ steps.scope.outputs.container_required != 'true' }}
        shell: bash
        run: |
          echo '::notice title=Container smoke::Not required for this change.'
          printf '%s\n' '### Container smoke' '' 'Not required for this change.' >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch parallel container workers
        if: ${{ steps.scope.outputs.container_required == 'true' }}
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          worker_ref="$DEFAULT_BRANCH"
          if ! grep -Fx 'name: Container smoke workers' .github/workflows/container-smoke.yml >/dev/null; then
            worker_ref='ci/smoke-worker-bootstrap'
          fi
          payload=$(jq -nc \
            --arg ref "$worker_ref" \
            --arg pr_number "$PR" \
            --arg head_sha "$HEAD_SHA" \
            '{ref:$ref, return_run_details:true, inputs:{pr_number:$pr_number, head_sha:$head_sha}}')
          response=$(gh api --method POST \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPO/actions/workflows/container-smoke.yml/dispatches" \
            --input - <<<"$payload")
          run_id=$(printf '%s' "$response" | jq -r '.workflow_run_id')
          test -n "$run_id"
          test "$run_id" != null
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Require all container workers
        if: ${{ steps.scope.outputs.container_required == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$RUN_ID"
          if gh run watch "$RUN_ID" --repo "$REPO" --exit-status; then
            echo '::notice title=Container smoke::All required container platforms passed.'
            printf '%s\n' '### Container smoke' '' 'All required container platforms passed in parallel.' '' "Worker run: $run_url" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          failures=$(gh api --method GET "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            -f filter=all \
            -f per_page=100 \
            --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | "\(.name) (\(.conclusion // .status))"')
          [ -n "$failures" ] || failures='worker workflow did not finish successfully'
          message=$(printf '%s\n' "$failures" | paste -sd ';' -)
          echo "::error title=Container smoke failed::$message"
          {
            printf '%s\n' '### Container smoke failed' ''
            printf '%s\n' "$failures" | sed 's/^/- /'
            printf '\nWorker run: %s\n' "$run_url"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
