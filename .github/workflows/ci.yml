name: Quality gate

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch: {}

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # 仅允许严格的文档白名单跳过代码质量门禁；其他任何改动均运行完整质量检查。
  quality_gate:
    name: Quality gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/classify-change-scope
        id: scope
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"

      - name: Test
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: go test ./... -count=1

      - name: Test with race detector
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: go test -race ./... -count=1

      - name: Vet
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: go vet ./...

      - name: Build local binary
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: sh scripts/build.sh

      - name: Version smoke
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ./build/javdb --version | tee /tmp/javdb-version.txt
          grep -F 'javdb version' /tmp/javdb-version.txt >/dev/null

      - name: Test release packaging and workflow policy
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: |
          sh scripts/test-package-release.sh
          sh scripts/test-build-platform.sh
          sh scripts/test-homebrew-formula.sh
          sh scripts/test-workflows.sh
          sh scripts/test-releasenotes.sh
