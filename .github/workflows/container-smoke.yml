name: Container smoke workers

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number for this worker run
        required: false
        default: ''
        type: string
      head_sha:
        description: Exact source commit to verify
        required: false
        default: ''
        type: string

concurrency:
  group: container-smoke-worker-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  setup:
    name: Resolve container workers
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve container matrix
        id: matrix
        shell: bash
        run: go run ./tools/platformmatrix --capability container --github-output "$GITHUB_OUTPUT"

  worker:
    needs: setup
    name: Container platform - ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/head', inputs.pr_number) || inputs.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false

      - name: Require the requested source
        if: ${{ inputs.head_sha != '' }}
        shell: bash
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Build the smoke Linux binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          sh scripts/build-release.sh \
            --version '0.0.0-smoke' \
            --release-date '2026-01-01' \
            --target 'linux/${{ matrix.goarch }}' \
            --output dist/javdb

      - name: Build the container image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg REVISION=smoke-revision \
            --build-arg VERSION=0.0.0-smoke \
            -t "javdb-cli-smoke:${{ matrix.goarch }}" .

      - name: Verify OCI labels
        shell: bash
        run: |
          set -euo pipefail
          image="javdb-cli-smoke:${{ matrix.goarch }}"
          docker image inspect "$image" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            | grep -Fx 'smoke-revision'
          docker image inspect "$image" \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
            | grep -Fx '0.0.0-smoke'
          docker image inspect "$image" \
            --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' \
            | grep -Fx 'https://github.com/FlanChanXwO/javdb-cli'
          docker image inspect "$image" \
            --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' \
            | grep -Fx 'MIT'

      - name: Verify non-root user
        shell: bash
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id javdb-cli-smoke:${{ matrix.goarch }} -u)
          if [ "$uid" = "0" ]; then
            echo 'Container must not run as root (UID 0)' >&2
            exit 1
          fi

      - name: Verify exact smoke version
        shell: bash
        run: |
          set -euo pipefail
          version=$(docker run --rm javdb-cli-smoke:${{ matrix.goarch }} --version)
          printf '%s\n' "$version" | grep -F 'javdb version 0.0.0-smoke (2026-01-01)'

      - name: Verify state path and permissions
        shell: bash
        run: |
          set -euo pipefail
          config_path=$(docker run --rm javdb-cli-smoke:${{ matrix.goarch }} config path)
          printf '%s\n' "$config_path" | grep -F '/home/javdb/.javdb-cli/'
          state_mode=$(docker run --rm --entrypoint stat javdb-cli-smoke:${{ matrix.goarch }} -c '%a' /home/javdb/.javdb-cli)
          test "$state_mode" = 700

      - name: Verify working directory and write access
        shell: bash
        run: |
          set -euo pipefail
          workdir=$(docker run --rm --entrypoint sh javdb-cli-smoke:${{ matrix.goarch }} -c 'pwd')
          test "$workdir" = /work
          docker run --rm --entrypoint sh javdb-cli-smoke:${{ matrix.goarch }} -c \
            'touch /work/container-smoke && test -f /work/container-smoke'

      - name: Verify embedded license
        shell: bash
        run: |
          docker run --rm --entrypoint sh javdb-cli-smoke:${{ matrix.goarch }} -c \
            'test -s /usr/share/doc/javdb-cli/LICENSE'

  publish:
    if: ${{ always() && inputs.head_sha != '' }}
    needs: [setup, worker]
    name: Publish container smoke result
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      statuses: write
    steps:
      - name: Publish aggregate container smoke status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SETUP_RESULT: ${{ needs.setup.result }}
          WORKER_RESULT: ${{ needs.worker.result }}
        run: |
          set -euo pipefail
          state=failure
          description='Container smoke failed on one or more required platforms.'
          failures=
          if [ "$SETUP_RESULT" != success ]; then
            description='Container configuration could not be resolved.'
          elif [ "$WORKER_RESULT" = success ]; then
            state=success
            description='All required container platforms passed.'
          else
            failures=$(gh api --method GET "repos/$REPO/actions/runs/$GITHUB_RUN_ID/jobs" \
              -f filter=all \
              -f per_page=100 \
              --jq '.jobs[] | select(.name | startswith("Container platform - ")) | select(.conclusion != "success" and .conclusion != "skipped") | "\(.name) (\(.conclusion // .status))"')
            if [ -n "$failures" ]; then
              message=$(printf '%s\n' "$failures" | paste -sd ';' -)
              description="Container smoke failed: $message"
            fi
          fi
          run_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context='Container smoke gate' \
            -f description="${description:0:140}" \
            -f target_url="$run_url" >/dev/null
          if [ "$state" = success ]; then
            printf '%s\n' '### Container smoke' '' "$description" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Container smoke failed::$description"
            {
              printf '%s\n' '### Container smoke failed' ''
              if [ -n "$failures" ]; then
                printf '%s\n' "$failures" | sed 's/^/- /'
              else
                printf '%s\n' "- $description"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
