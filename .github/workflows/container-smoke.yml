name: Container smoke workers

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number for this worker run
        required: false
        default: ''
        type: string
      head_sha:
        description: Exact source commit to verify
        required: false
        default: ''
        type: string

concurrency:
  group: container-smoke-worker-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  setup:
    name: Resolve container workers
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve container matrix
        id: matrix
        shell: bash
        run: go run ./tools/platformmatrix --capability container --github-output "$GITHUB_OUTPUT"

  worker:
    needs: setup
    name: Container platform - ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/head', inputs.pr_number) || inputs.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Require the requested source
        if: ${{ inputs.head_sha != '' }}
        shell: bash
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Build the smoke Linux binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          sh scripts/build-release.sh \
            --version '0.0.0-smoke' \
            --release-date '2026-01-01' \
            --target 'linux/${{ matrix.goarch }}' \
            --output dist/javdb

      - name: Build the container image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg REVISION=smoke-revision \
            --build-arg VERSION=0.0.0-smoke \
            -t "javdb-cli-smoke:${{ matrix.goarch }}" .

      - name: Verify OCI labels
        shell: bash
        run: |
          set -euo pipefail
          image="javdb-cli-smoke:${{ matrix.goarch }}"
          docker image inspect "$image" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            | grep -Fx 'smoke-revision'
          docker image inspect "$image" \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
            | grep -Fx '0.0.0-smoke'
          docker image inspect "$image" \
            --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' \
            | grep -Fx 'https://github.com/FlanChanXwO/javdb-cli'
          docker image inspect "$image" \
            --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' \
            | grep -Fx 'MIT'

      - name: Verify non-root user
        shell: bash
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id javdb-cli-smoke:${{ matrix.goarch }} -u)
          if [ "$uid" = "0" ]; then
            echo 'Container must not run as root (UID 0)' >&2
            exit 1
          fi

      - name: Verify exact smoke version
        shell: bash
        run: |
          set -euo pipefail
          version=$(docker run --rm javdb-cli-smoke:${{ matrix.goarch }} --version)
          printf '%s\n' "$version" | grep -F 'javdb version 0.0.0-smoke (2026-01-01)'

      - name: Verify state path and permissions
        shell: bash
        run: |
          set -euo pipefail
          config_path=$(docker run --rm javdb-cli-smoke:${{ matrix.goarch }} config path)
          printf '%s\n' "$config_path" | grep -F '/home/javdb/.javdb-cli/'
          state_mode=$(docker run --rm --entrypoint stat javdb-cli-smoke:${{ matrix.goarch }} -c '%a' /home/javdb/.javdb-cli)
          test "$state_mode" = 700

      - name: Verify working directory and write access
        shell: bash
        run: |
          set -euo pipefail
          workdir=$(docker run --rm --entrypoint sh javdb-cli-smoke:${{ matrix.goarch }} -c 'pwd')
          test "$workdir" = /work
          docker run --rm --entrypoint sh javdb-cli-smoke:${{ matrix.goarch }} -c \
            'touch /work/container-smoke && test -f /work/container-smoke'

      - name: Verify embedded license
        shell: bash
        run: |
          docker run --rm --entrypoint sh javdb-cli-smoke:${{ matrix.goarch }} -c \
            'test -s /usr/share/doc/javdb-cli/LICENSE'
