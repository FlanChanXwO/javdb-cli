name: Container image smoke

# 只在容器打包契约相关路径变更时运行；其余 PR 由 ci/platform-smoke 覆盖。
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: container-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  classify_changes:
    name: Classify change scope
    runs-on: ubuntu-24.04
    outputs:
      container_required: ${{ steps.scope.outputs.container_required }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/classify-change-scope
        id: scope
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  resolve_platforms:
    name: Resolve container matrix
    needs: classify_changes
    if: needs.classify_changes.outputs.container_required == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve container platforms
        id: matrix
        shell: bash
        run: go run ./tools/platformmatrix --capability container --github-output "$GITHUB_OUTPUT"

  container_smoke:
    needs: [classify_changes, resolve_platforms]
    if: needs.classify_changes.outputs.container_required == 'true'
    name: Container smoke ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve_platforms.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the smoke Linux binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # 注入固定 smoke release date，使 --version 走正式版输出路径
          # （javdb version <version> (<date>)），贴近生产镜像契约。
          sh scripts/build-release.sh \
            --version '0.0.0-smoke' \
            --release-date '2026-01-01' \
            --target 'linux/${{ matrix.goarch }}' \
            --output dist/javdb

      - name: Build the container image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg REVISION=smoke-revision \
            --build-arg VERSION=0.0.0-smoke \
            -t "javdb-cli-smoke:${{ matrix.goarch }}" .

      - name: Verify OCI labels
        shell: bash
        run: |
          set -euo pipefail
          image="javdb-cli-smoke:${{ matrix.goarch }}"
          docker image inspect "$image" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            | grep -Fx 'smoke-revision'
          docker image inspect "$image" \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
            | grep -Fx '0.0.0-smoke'
          docker image inspect "$image" \
            --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' \
            | grep -Fx 'https://github.com/FlanChanXwO/javdb-cli'
          docker image inspect "$image" \
            --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' \
            | grep -Fx 'MIT'

      - name: Verify non-root user
        shell: bash
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id javdb-cli-smoke:${{ matrix.goarch }} -u)
          if [ "$uid" = "0" ]; then
            echo "Container must not run as root (UID 0)" >&2
            exit 1
          fi

      - name: Verify exact smoke version
        shell: bash
        run: |
          set -euo pipefail
          version=$(docker run --rm javdb-cli-smoke:${{ matrix.goarch }} --version)
          printf '%s\n' "$version" | grep -F 'javdb version 0.0.0-smoke (2026-01-01)'

      - name: Verify state path and permissions
        shell: bash
        run: |
          set -euo pipefail
          config_path=$(docker run --rm javdb-cli-smoke:${{ matrix.goarch }} config path)
          printf '%s\n' "$config_path" | grep -F '/home/javdb/.javdb-cli/'
          state_mode=$(docker run --rm --entrypoint stat javdb-cli-smoke:${{ matrix.goarch }} -c '%a' /home/javdb/.javdb-cli)
          test "$state_mode" = 700

      - name: Verify working directory and write access
        shell: bash
        run: |
          set -euo pipefail
          workdir=$(docker run --rm --entrypoint sh javdb-cli-smoke:${{ matrix.goarch }} -c 'pwd')
          test "$workdir" = /work
          docker run --rm --entrypoint sh javdb-cli-smoke:${{ matrix.goarch }} -c \
            'touch /work/container-smoke && test -f /work/container-smoke'

      - name: Verify embedded license
        shell: bash
        run: |
          docker run --rm --entrypoint sh javdb-cli-smoke:${{ matrix.goarch }} -c \
            'test -s /usr/share/doc/javdb-cli/LICENSE'

  container_smoke_gate:
    name: Container smoke gate
    needs: [classify_changes, resolve_platforms, container_smoke]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require expected container outcome
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify_changes.result }}
          CONTAINER_REQUIRED: ${{ needs.classify_changes.outputs.container_required }}
          RESOLVE_RESULT: ${{ needs.resolve_platforms.result }}
          MATRIX_RESULT: ${{ needs.container_smoke.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFY_RESULT" = success
          if [ "$CONTAINER_REQUIRED" != true ]; then
            test "$RESOLVE_RESULT" = skipped
            test "$MATRIX_RESULT" = skipped
          else
            test "$RESOLVE_RESULT" = success
            test "$MATRIX_RESULT" = success
          fi
