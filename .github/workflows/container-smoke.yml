name: Container image smoke

# 只在容器打包契约相关路径变更时运行；其余 PR 由 ci/platform-smoke 覆盖。
on:
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/container-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/container-smoke.yml'
  workflow_dispatch: {}

concurrency:
  group: container-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  container_smoke:
    name: Container smoke ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the smoke Linux binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # 注入固定 smoke release date，使 --version 走正式版输出路径
          # （javdb version <version> (<date>)），贴近生产镜像契约。
          sh scripts/build-release.sh \
            --version '0.0.0-smoke' \
            --release-date '2026-01-01' \
            --target 'linux/${{ matrix.goarch }}' \
            --output dist/javdb

      - name: Build the container image
        shell: bash
        run: docker build -t javdb-cli-smoke:${{ matrix.goarch }} .

      - name: Verify non-root user
        shell: bash
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id javdb-cli-smoke:${{ matrix.goarch }} -u)
          if [ "$uid" = "0" ]; then
            echo "Container must not run as root (UID 0)" >&2
            exit 1
          fi

      - name: Verify exact smoke version
        shell: bash
        run: |
          set -euo pipefail
          version=$(docker run --rm javdb-cli-smoke:${{ matrix.goarch }} --version)
          printf '%s\n' "$version" | grep -F 'javdb version 0.0.0-smoke (2026-01-01)'

      - name: Verify state path
        shell: bash
        run: |
          set -euo pipefail
          config_path=$(docker run --rm javdb-cli-smoke:${{ matrix.goarch }} config path)
          printf '%s\n' "$config_path" | grep -F '/home/javdb/.javdb-cli/'

      - name: Verify working directory
        shell: bash
        run: |
          set -euo pipefail
          workdir=$(docker run --rm --entrypoint sh javdb-cli-smoke:${{ matrix.goarch }} -c 'pwd')
          test "$workdir" = /work

      - name: Verify embedded license
        shell: bash
        run: |
          docker run --rm --entrypoint sh javdb-cli-smoke:${{ matrix.goarch }} -c \
            'test -s /usr/share/doc/javdb-cli/LICENSE'
