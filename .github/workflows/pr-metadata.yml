name: PR metadata

on:
  pull_request_target:
    branches:
      - main
    types: [opened, edited, reopened, ready_for_review, synchronize]

permissions: {}

concurrency:
  group: pr-gates-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && github.event.changes.base == null && 'metadata' || 'head' }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR metadata
    runs-on: ubuntu-24.04
    outputs:
      smoke_ready: ${{ steps.smoke_outputs.outputs.ready }}
      platform_required: ${{ steps.smoke_outputs.outputs.platform_required }}
      container_required: ${{ steps.smoke_outputs.outputs.container_required }}
      base_ref: ${{ steps.smoke_outputs.outputs.base_ref }}
      head_sha: ${{ steps.smoke_outputs.outputs.head_sha }}
      pr_number: ${{ steps.smoke_outputs.outputs.pr_number }}
    permissions:
      contents: read
      issues: write
      statuses: write
    steps:
      - name: Resolve the protected base branch tip
        id: base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pr_json=$(gh api "repos/$REPO/pulls/$PR")
          base_ref=$(printf '%s' "$pr_json" | jq -r '.base.ref')
          test -n "$base_ref"
          test "$base_ref" != null
          base_ref_encoded=$(printf '%s' "$base_ref" | jq -sRr @uri)
          sha=$(gh api "repos/$REPO/branches/$base_ref_encoded" --jq '.commit.sha')
          test -n "$sha"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.base.outputs.sha }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate template and verification declaration
        id: policy
        continue-on-error: true
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          go run ./tools/prmeta --body-file "$RUNNER_TEMP/pr-body.md" --whitelist tools/verification/command-whitelist.txt --cli javdb --github-output "$GITHUB_OUTPUT"

      - name: Publish stable PR gate statuses
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEMPLATE_OK: ${{ steps.policy.outputs.template_ok }}
          TEMPLATE_DESC: ${{ steps.policy.outputs.template_desc }}
          COMMANDS_OK: ${{ steps.policy.outputs.commands_ok }}
          COMMANDS_DESC: ${{ steps.policy.outputs.commands_desc }}
        run: |
          set -euo pipefail
          event_body="$RUNNER_TEMP/event-pr-body.md"
          current_body="$RUNNER_TEMP/current-pr-body.md"
          printf '%s' "$PR_BODY" > "$event_body"
          metadata_is_current() {
            gh api "repos/$REPO/pulls/$PR" | jq -j '.body // ""' > "$current_body"
            if ! cmp -s "$event_body" "$current_body"; then
              echo 'PR body changed since this event; skipping stale metadata status publication.'
              return 1
            fi
          }
          template_state=failure
          commands_state=failure
          [ "$TEMPLATE_OK" = true ] && template_state=success
          [ "$COMMANDS_OK" = true ] && commands_state=success
          metadata_is_current || exit 0
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" -f state="$template_state" -f context='PR template gate' -f description="${TEMPLATE_DESC:0:140}" -f target_url="$RUN_URL"
          metadata_is_current || exit 0
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" -f state="$commands_state" -f context='PR commands gate' -f description="${COMMANDS_DESC:0:140}" -f target_url="$RUN_URL"

      - name: Fetch pull request head for trusted smoke classification
        id: smoke_head
        if: ${{ github.event.action != 'edited' || github.event.changes.base != null }}
        continue-on-error: true
        shell: bash
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pull/$PR/head"
          test "$(git rev-parse "refs/remotes/pull/$PR/head")" = "$HEAD_SHA"

      - name: Classify smoke scope with trusted policy
        if: ${{ (github.event.action != 'edited' || github.event.changes.base != null) && steps.smoke_head.outcome == 'success' }}
        id: smoke_scope
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash ./scripts/classify-change-scope.sh --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

      - name: Export trusted smoke inputs
        id: smoke_outputs
        if: ${{ github.event.action != 'edited' || github.event.changes.base != null }}
        shell: bash
        env:
          SMOKE_HEAD_OUTCOME: ${{ steps.smoke_head.outcome }}
          SMOKE_SCOPE_OUTCOME: ${{ steps.smoke_scope.outcome }}
          PLATFORM_REQUIRED: ${{ steps.smoke_scope.outputs.platform_required }}
          CONTAINER_REQUIRED: ${{ steps.smoke_scope.outputs.container_required }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          ready=false
          if [ "$SMOKE_HEAD_OUTCOME" = success ] && [ "$SMOKE_SCOPE_OUTCOME" = success ]; then
            ready=true
          fi
          printf 'ready=%s\n' "$ready" >> "$GITHUB_OUTPUT"
          printf 'platform_required=%s\n' "${PLATFORM_REQUIRED:-false}" >> "$GITHUB_OUTPUT"
          printf 'container_required=%s\n' "${CONTAINER_REQUIRED:-false}" >> "$GITHUB_OUTPUT"
          printf 'base_ref=%s\n' "$BASE_REF" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          printf 'pr_number=%s\n' "$PR" >> "$GITHUB_OUTPUT"

      - name: Maintain invalid-PR age state
        if: ${{ !cancelled() && steps.policy.outcome != 'skipped' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          TEMPLATE_OK: ${{ steps.policy.outputs.template_ok }}
          COMMANDS_OK: ${{ steps.policy.outputs.commands_ok }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/event-pr-body-state.md"
          gh api "repos/$REPO/pulls/$PR" | jq -j '.body // ""' > "$RUNNER_TEMP/current-pr-body-state.md"
          if ! cmp -s "$RUNNER_TEMP/event-pr-body-state.md" "$RUNNER_TEMP/current-pr-body-state.md"; then
            echo 'PR body changed since this event; skipping stale metadata state publication.'
            exit 0
          fi
          state_comment=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- pr-policy-state:"))) | .id' | head -1)
          if [ "$TEMPLATE_OK" = true ] && [ "$COMMANDS_OK" = true ]; then
            if [ -n "$state_comment" ]; then
              gh api --method DELETE "repos/$REPO/issues/comments/$state_comment" >/dev/null
            fi
            exit 0
          fi

          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body-state.md"
          body_hash=$(sha256sum "$RUNNER_TEMP/pr-body-state.md" | awk '{print $1}')
          first_failed_at=
          if [ -n "$state_comment" ]; then
            old_body=$(gh api "repos/$REPO/issues/comments/$state_comment" --jq '.body')
            old_state=$(printf '%s\n' "$old_body" | sed -n 's/^<!-- pr-policy-state:\(.*\) -->$/\1/p' | head -1)
            if [ -n "$old_state" ] && printf '%s' "$old_state" | jq -e . >/dev/null 2>&1; then
              old_hash=$(printf '%s' "$old_state" | jq -r '.body_sha256 // ""')
              if [ "$old_hash" = "$body_hash" ]; then
                first_failed_at=$(printf '%s' "$old_state" | jq -r '.first_failed_at // ""')
              fi
            fi
          fi
          if [ -z "$first_failed_at" ]; then
            first_failed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          fi
          state=$(jq -nc --arg hash "$body_hash" --arg first "$first_failed_at" '{body_sha256:$hash,first_failed_at:$first}')
          {
            printf '<!-- pr-policy-state:%s -->\n\n' "$state"
            printf '%s\n' 'PR metadata is currently invalid. If the PR body remains unchanged and invalid for 7 days, the PR will be closed automatically.'
          } > "$RUNNER_TEMP/pr-policy-state.md"
          if [ -n "$state_comment" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$state_comment" -F body=@"$RUNNER_TEMP/pr-policy-state.md" >/dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/pr-policy-state.md" >/dev/null
          fi

      - name: Require metadata gates
        shell: bash
        env:
          TEMPLATE_OK: ${{ steps.policy.outputs.template_ok }}
          COMMANDS_OK: ${{ steps.policy.outputs.commands_ok }}
        run: |
          set -euo pipefail
          test "$TEMPLATE_OK" = true
          test "$COMMANDS_OK" = true

  platform_smoke_gate:
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && 'Platform smoke metadata no-op' || 'Platform smoke gate' }}
    needs: validate
    if: >-
      ${{
        always() &&
        (github.event.action != 'edited' || github.event.changes.base != null) &&
        (needs.validate.outputs.smoke_ready != 'true' || needs.validate.outputs.platform_required == 'true')
      }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Require trusted smoke classification
        env:
          SMOKE_READY: ${{ needs.validate.outputs.smoke_ready }}
        run: test "$SMOKE_READY" = true

      - name: Run trusted platform smoke workers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ needs.validate.outputs.base_ref }}
          HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          PR: ${{ needs.validate.outputs.pr_number }}
        run: |
          set -euo pipefail
          payload=$(jq -nc \
            --arg ref "$BASE_REF" \
            --arg pr_number "$PR" \
            --arg head_sha "$HEAD_SHA" \
            '{ref:$ref, inputs:{pr_number:$pr_number, head_sha:$head_sha}}')
          response=$(gh api --method POST \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPO/actions/workflows/platform-smoke.yml/dispatches" \
            --input - <<<"$payload")
          RUN_ID=$(printf '%s' "$response" | jq -r '.workflow_run_id')
          case "$RUN_ID" in
            ''|null|*[!0-9]*) echo 'Trusted platform smoke run id was not returned.' >&2; exit 1 ;;
          esac
          gh run watch "$RUN_ID" --repo "$REPO" --exit-status

  container_smoke_gate:
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && 'Container smoke metadata no-op' || 'Container smoke gate' }}
    needs: validate
    if: >-
      ${{
        always() &&
        (github.event.action != 'edited' || github.event.changes.base != null) &&
        (needs.validate.outputs.smoke_ready != 'true' || needs.validate.outputs.container_required == 'true')
      }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Require trusted smoke classification
        env:
          SMOKE_READY: ${{ needs.validate.outputs.smoke_ready }}
        run: test "$SMOKE_READY" = true

      - name: Run trusted container smoke workers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ needs.validate.outputs.base_ref }}
          HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          PR: ${{ needs.validate.outputs.pr_number }}
        run: |
          set -euo pipefail
          payload=$(jq -nc \
            --arg ref "$BASE_REF" \
            --arg pr_number "$PR" \
            --arg head_sha "$HEAD_SHA" \
            '{ref:$ref, inputs:{pr_number:$pr_number, head_sha:$head_sha}}')
          response=$(gh api --method POST \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPO/actions/workflows/container-smoke.yml/dispatches" \
            --input - <<<"$payload")
          RUN_ID=$(printf '%s' "$response" | jq -r '.workflow_run_id')
          case "$RUN_ID" in
            ''|null|*[!0-9]*) echo 'Trusted container smoke run id was not returned.' >&2; exit 1 ;;
          esac
          gh run watch "$RUN_ID" --repo "$REPO" --exit-status
