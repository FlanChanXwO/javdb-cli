name: Publish Homebrew formula

# §16.2：Homebrew 是独立 publisher，与容器、ClawHub 并行，任一渠道失败不阻塞其他。
on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  # §17：手动恢复只接受原始的 release_run_id。
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Original trusted Release workflow run ID
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Publish Homebrew formula
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    # §23/§24：environment 承载 Homebrew 专属凭据，但不再要求额外的 reviewer 审批；
    # 全链路只有 release-approval 一个人工审批边界。
    environment: release
    permissions:
      actions: read
      contents: read
    steps:
      - name: Resolve the trusted release run
        id: handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            run_id="$INPUT_RUN_ID"
          else
            run_id="$EVENT_RUN_ID"
          fi
          case "$run_id" in
            ''|*[!0-9]*) echo "release_run_id must be a positive decimal number: $run_id" >&2; exit 1 ;;
          esac
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
          test "$(printf '%s' "$run" | jq -r '.name')" = 'Release'
          test "$(printf '%s' "$run" | jq -r '.conclusion')" = success
          test "$(printf '%s' "$run" | jq -r '.repository.full_name')" = "$GITHUB_REPOSITORY"
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$(printf '%s' "$run" | jq -r '.head_sha')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.handoff.outputs.head_sha }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the prepared handoff and release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prepared-release-metadata
          path: prepared
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.handoff.outputs.run_id }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: verified-release-*
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.handoff.outputs.run_id }}

      # §15/§19：Homebrew 只从已批准的 checksum 渲染 formula，不重新打包归档。
      - name: Verify the immutable handoff
        id: verify
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.handoff.outputs.run_id }}
          RUN_HEAD_SHA: ${{ steps.handoff.outputs.head_sha }}
        run: |
          set -euo pipefail
          # Homebrew 只发布 release 归档，因此只校验 production section；容器
          # 产物的校验由独立容器 publisher 负责（§16/§20 并行独立）。
          cp prepared/dist/checksums.txt release-assets/checksums.txt
          go run ./tools/release verify-handoff-set \
            --handoff prepared/release/release-handoff.json \
            --section production \
            --dist-dir release-assets \
            --container-dir containers \
            --checksums release-assets/checksums.txt \
            --repository "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --run-head-sha "$RUN_HEAD_SHA"

      - name: Render the formula from prepared checksums
        shell: bash
        env:
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p staging-formula
          bash scripts/render-homebrew-formula.sh \
            --version "$VERSION" \
            --checksums prepared/dist/checksums.txt \
            --output staging-formula/javdb-cli.rb
          printf '%s\n' javdb-cli > staging-formula/formula-name

      - name: Prepare the exact Homebrew formula commit
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(cat staging-formula/formula-name)" = javdb-cli
          test -f staging-formula/javdb-cli.rb
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          git clone https://github.com/FlanChanXwO/homebrew-tap.git "$tap_dir"
          git -C "$tap_dir" config user.name github-actions[bot]
          git -C "$tap_dir" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p "$tap_dir/Formula"
          cp staging-formula/javdb-cli.rb "$tap_dir/Formula/javdb-cli.rb"
          git -C "$tap_dir" add -- Formula/javdb-cli.rb
          test "$(git -C "$tap_dir" diff --cached --name-only)" = Formula/javdb-cli.rb
          git -C "$tap_dir" commit -m "$RELEASE_TAG: update javdb-cli formula"
          if git -C "$tap_dir" diff --quiet HEAD^ HEAD -- Formula/javdb-cli.rb; then
            printf 'Formula already matches %s; nothing to publish.\n' "$RELEASE_TAG"
          fi

      # §23：该 publisher 只持有 Homebrew tap 的部署密钥。
      - name: Push the verified Homebrew formula
        shell: bash
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOMEBREW_TAP_DEPLOY_KEY"
          umask 077
          key_path="$RUNNER_TEMP/homebrew-tap-deploy-key"
          trap 'rm -f "$key_path"' EXIT HUP INT TERM
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$key_path"
          chmod 600 "$key_path"
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          git -C "$tap_dir" remote set-url origin git@github.com:FlanChanXwO/homebrew-tap.git
          GIT_SSH_COMMAND="ssh -i $key_path -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/templates/homebrew/github.com-known-hosts" \
            git -C "$tap_dir" push origin HEAD:main
