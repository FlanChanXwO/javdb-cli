name: Platform packaged binary smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: platform-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # 与 Quality gate 使用相同的严格文档白名单，避免纯文档改动占用六个平台 runner。
  classify_changes:
    name: Classify change scope
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/classify-change-scope
        id: scope
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  packaged_binary_smoke:
    needs: classify_changes
    # 矩阵必须始终展开并上报六个固定名称，否则文档 PR 会永久等待分支保护所需的 checks。
    # 纯文档改动统一使用轻量 Ubuntu runner；其他改动仍使用声明的六个原生 runner。
    name: Packaged binary smoke ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ needs.classify_changes.outputs.docs_only == 'true' && 'ubuntu-24.04' || matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
          - runner: windows-2025
            goos: windows
            goarch: amd64
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
    steps:
      - name: Confirm docs-only native smoke skip
        if: needs.classify_changes.outputs.docs_only == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'Docs-only change: native smoke is intentionally skipped for ${{ matrix.goos }}/${{ matrix.goarch }}.'

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: needs.classify_changes.outputs.docs_only != 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: needs.classify_changes.outputs.docs_only != 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Require the declared native target
        if: needs.classify_changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOOS)" = '${{ matrix.goos }}'
          test "$(go env GOARCH)" = '${{ matrix.goarch }}'

      - name: Test and vet on the native platform
        if: needs.classify_changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -count=1
          go vet ./...

      - name: Test with the race detector where Go supports it
        if: needs.classify_changes.outputs.docs_only != 'true' && (matrix.goos != 'windows' || matrix.goarch != 'arm64')
        shell: bash
        run: go test -race ./... -count=1

      - name: Build, package, extract, and smoke the native binary
        if: needs.classify_changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="0.1.1-ci.${GITHUB_RUN_ID}"
          mkdir -p dist smoke
          binary='dist/javdb'
          if [ '${{ matrix.goos }}' = windows ]; then
            binary='dist/javdb.exe'
          fi
          sh scripts/build-release.sh \
            --version "$version" \
            --target '${{ matrix.goos }}/${{ matrix.goarch }}' \
            --output "$binary"
          sh scripts/package-release.sh \
            --binary "$binary" \
            --version "$version" \
            --target '${{ matrix.goos }}/${{ matrix.goarch }}' \
            --output-dir dist
          archive="dist/javdb-cli_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          smoked_binary='smoke/javdb'
          if [ '${{ matrix.goos }}' = windows ]; then
            7z x "${archive}.zip" -osmoke
            smoked_binary='smoke/javdb.exe'
          else
            tar -xzf "${archive}.tar.gz" -C smoke
          fi
          test -f "$smoked_binary"
          "./$smoked_binary" version --json | tee "$RUNNER_TEMP/javdb-version.json"
          grep -F "\"version\":\"v${version}\"" "$RUNNER_TEMP/javdb-version.json"

  # 稳定汇总 job 要求六个平台矩阵成功；纯文档矩阵由同名轻量检查满足分支保护。
  platform_smoke_gate:
    name: Platform smoke gate
    needs:
      - classify_changes
      - packaged_binary_smoke
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require the expected matrix outcome
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.packaged_binary_smoke.result }}
        run: |
          set -euo pipefail
          test "$MATRIX_RESULT" = success
