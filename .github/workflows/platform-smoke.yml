name: Platform smoke workers

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number for this worker run
        required: false
        default: ''
        type: string
      head_sha:
        description: Exact source commit to verify
        required: false
        default: ''
        type: string

concurrency:
  group: platform-smoke-worker-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  setup:
    name: Resolve platform workers
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve native platform matrix
        id: matrix
        shell: bash
        run: go run ./tools/platformmatrix --capability smoke --github-output "$GITHUB_OUTPUT"

  worker:
    needs: setup
    name: Native platform - ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/head', inputs.pr_number) || inputs.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Require the requested source
        if: ${{ inputs.head_sha != '' }}
        shell: bash
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Require the declared native target
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOOS)" = '${{ matrix.goos }}'
          test "$(go env GOARCH)" = '${{ matrix.goarch }}'

      - name: Test and vet on the native platform
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -count=1
          go vet ./...

      - name: Test with the race detector where Go supports it
        if: ${{ contains(matrix.capabilities, 'race') }}
        shell: bash
        run: go test -race ./... -count=1

      - name: Build, package, extract, and smoke the native binary
        shell: bash
        run: |
          set -euo pipefail
          version="0.1.1-ci.${GITHUB_RUN_ID}"
          archive=$(sh scripts/build-platform.sh \
            --version "$version" \
            --target '${{ matrix.goos }}/${{ matrix.goarch }}' \
            --output-dir dist)
          mkdir -p smoke
          smoked_binary='smoke/javdb'
          if [ '${{ matrix.goos }}' = windows ]; then
            7z x "$archive" -osmoke
            smoked_binary='smoke/javdb.exe'
          else
            tar -xzf "$archive" -C smoke
          fi
          test -f "$smoked_binary"
          "./$smoked_binary" --version | tee "$RUNNER_TEMP/javdb-version.txt"
          grep -F "javdb version ${version}" "$RUNNER_TEMP/javdb-version.txt"
