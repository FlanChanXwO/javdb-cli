name: Platform packaged binary smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: platform-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # 与 Quality gate 使用相同的严格文档白名单，避免纯文档改动占用六个平台 runner。
  classify_changes:
    name: Classify change scope
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      platform_required: ${{ steps.scope.outputs.platform_required }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/classify-change-scope
        id: scope
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  resolve_platforms:
    name: Resolve platform matrix
    needs: classify_changes
    if: needs.classify_changes.outputs.platform_required == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve smoke platforms
        id: matrix
        shell: bash
        run: go run ./tools/platformmatrix --capability smoke --github-output "$GITHUB_OUTPUT"

  packaged_binary_smoke:
    needs: [classify_changes, resolve_platforms]
    # 纯文档改动不运行矩阵；静态 job 名称避免 job-level skip 时渲染未展开的 matrix 表达式。
    if: needs.classify_changes.outputs.docs_only != 'true'
    name: Packaged binary smoke
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve_platforms.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Require the declared native target
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOOS)" = '${{ matrix.goos }}'
          test "$(go env GOARCH)" = '${{ matrix.goarch }}'

      - name: Test and vet on the native platform
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -count=1
          go vet ./...

      - name: Test with the race detector where Go supports it
        if: contains(matrix.capabilities, 'race')
        shell: bash
        run: go test -race ./... -count=1

      - name: Build, package, extract, and smoke the native binary
        shell: bash
        run: |
          set -euo pipefail
          version="0.1.1-ci.${GITHUB_RUN_ID}"
          archive=$(sh scripts/build-platform.sh \
            --version "$version" \
            --target '${{ matrix.goos }}/${{ matrix.goarch }}' \
            --output-dir dist)
          mkdir -p smoke
          smoked_binary='smoke/javdb'
          if [ '${{ matrix.goos }}' = windows ]; then
            7z x "$archive" -osmoke
            smoked_binary='smoke/javdb.exe'
          else
            tar -xzf "$archive" -C smoke
          fi
          test -f "$smoked_binary"
          "./$smoked_binary" --version | tee "$RUNNER_TEMP/javdb-version.txt"
          grep -F "javdb version ${version}" "$RUNNER_TEMP/javdb-version.txt"

  # 稳定汇总 job 是唯一受保护的平台检查；文档变更接受矩阵 skipped，代码变更要求 success。
  platform_smoke_gate:
    name: Platform smoke gate
    needs:
      - classify_changes
      - resolve_platforms
      - packaged_binary_smoke
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require the expected matrix outcome
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify_changes.result }}
          DOCS_ONLY: ${{ needs.classify_changes.outputs.docs_only }}
          PLATFORM_REQUIRED: ${{ needs.classify_changes.outputs.platform_required }}
          RESOLVE_RESULT: ${{ needs.resolve_platforms.result }}
          MATRIX_RESULT: ${{ needs.packaged_binary_smoke.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFY_RESULT" = success
          if [ "$PLATFORM_REQUIRED" != true ]; then
            test "$RESOLVE_RESULT" = skipped
            test "$MATRIX_RESULT" = skipped
          else
            test "$RESOLVE_RESULT" = success
            test "$MATRIX_RESULT" = success
          fi
