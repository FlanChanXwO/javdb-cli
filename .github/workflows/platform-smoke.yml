name: Platform packaged binary smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: platform-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # 与 Quality gate 使用相同的严格文档白名单，避免纯文档改动执行六个平台的重活。
  classify_changes:
    name: Classify change scope
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      platform_required: ${{ steps.scope.outputs.platform_required }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/classify-change-scope
        id: scope
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  resolve_platforms:
    name: Platform setup
    needs: classify_changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve smoke platforms
        id: matrix
        shell: bash
        env:
          REQUIRED: ${{ needs.classify_changes.outputs.platform_required }}
        run: |
          set -euo pipefail
          # worker 始终运行：被 skip 的 matrix job 会让 GitHub 原样显示
          # `${{ matrix.* }}` 占位符。非必需时只产出单个占位条目，名称里说明
          # 跳过原因，并落到便宜的 ubuntu runner，不占用六个平台 runner。
          if [ "$REQUIRED" = true ]; then
            raw=$(go run ./tools/platformmatrix --capability smoke)
            matrix=$(printf '%s' "$raw" | jq -c '.include |= map(. + {display: (.goos + "/" + .goarch), required: "true"})')
          else
            matrix=$(jq -nc '{include:[{display:"not required", required:"false", runner:"ubuntu-24.04", capabilities:[]}]}')
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  packaged_binary_smoke:
    needs: [classify_changes, resolve_platforms]
    # 刻意不加 job 级 if：被 skip 的 matrix job 会让 GitHub 原样显示
    # `${{ matrix.* }}` 占位符。改为始终运行，非必需变更落到便宜的
    # ubuntu-24.04 并跳过全部重活。
    name: Platform smoke · ${{ matrix.display }}
    runs-on: ${{ matrix.required == 'true' && matrix.runner || 'ubuntu-24.04' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve_platforms.outputs.matrix) }}
    steps:
      - name: Mark the change as not requiring platform smoke
        if: matrix.required != 'true'
        shell: bash
        run: printf '%s\n' 'Documentation-only change; platform smoke is not required.'

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: matrix.required == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: matrix.required == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Require the declared native target
        if: matrix.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOOS)" = '${{ matrix.goos }}'
          test "$(go env GOARCH)" = '${{ matrix.goarch }}'

      - name: Test and vet on the native platform
        if: matrix.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -count=1
          go vet ./...

      - name: Test with the race detector where Go supports it
        if: matrix.required == 'true' && contains(matrix.capabilities, 'race')
        shell: bash
        run: go test -race ./... -count=1

      - name: Build, package, extract, and smoke the native binary
        if: matrix.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="0.1.1-ci.${GITHUB_RUN_ID}"
          archive=$(sh scripts/build-platform.sh \
            --version "$version" \
            --target '${{ matrix.goos }}/${{ matrix.goarch }}' \
            --output-dir dist)
          mkdir -p smoke
          smoked_binary='smoke/javdb'
          if [ '${{ matrix.goos }}' = windows ]; then
            7z x "$archive" -osmoke
            smoked_binary='smoke/javdb.exe'
          else
            tar -xzf "$archive" -C smoke
          fi
          test -f "$smoked_binary"
          "./$smoked_binary" --version | tee "$RUNNER_TEMP/javdb-version.txt"
          grep -F "javdb version ${version}" "$RUNNER_TEMP/javdb-version.txt"

  # 稳定汇总 job 是唯一受保护的平台检查；非必需变更接受内部跳过，代码变更要求实际成功。
  platform_smoke_gate:
    name: Platform smoke gate
    needs:
      - classify_changes
      - resolve_platforms
      - packaged_binary_smoke
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require the expected matrix outcome
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify_changes.result }}
          PLATFORM_REQUIRED: ${{ needs.classify_changes.outputs.platform_required }}
          RESOLVE_RESULT: ${{ needs.resolve_platforms.result }}
          MATRIX_RESULT: ${{ needs.packaged_binary_smoke.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFY_RESULT" = success
          # setup 与 worker 始终运行；非必需变更在 worker 内部跳过重活。
          test "$RESOLVE_RESULT" = success
          test "$MATRIX_RESULT" = success
          if [ "$PLATFORM_REQUIRED" != true ]; then
            printf '%s\n' 'Documentation-only change; platform smoke is not required.'
          fi
