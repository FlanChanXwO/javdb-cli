name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable stable SemVer tag to publish
        required: true
        type: string

# push 和手动恢复只在此处选择发布 tag。后续所有 checkout、版本和 Release 都绑定该值。
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

permissions: {}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify the exact immutable stable release tag
        id: release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          fi
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          go run ./tools/release verify-source --tag "$tag" --default-branch "$DEFAULT_BRANCH" --github-output "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf '%s\n' "a GitHub Release already exists for $tag" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Check release workflow policy
        shell: bash
        run: sh scripts/test-workflows.sh

  release_notes_audit:
    name: Audit release notes
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate all versioned changelog indexes
        shell: bash
        run: sh scripts/test-releasenotes.sh

      - name: Validate the audited bilingual release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test -s "changelog/v${version}/en.md"
          test -s "changelog/v${version}/zh-CN.md"
          previous=$(sh scripts/previous-release-tag.sh "$RELEASE_TAG")
          args=(validate --version "$version" --dir "changelog/v$version")
          if [ -n "$previous" ]; then
            args+=(--previous "$previous")
          fi
          go run ./scripts/releasenotes "${args[@]}"
          go run ./scripts/releasenotes audit \
            --repo "$GITHUB_REPOSITORY" \
            --from "$previous" \
            --to "$RELEASE_TAG" \
            --output "$RUNNER_TEMP/release-notes-audit.json"
          args+=(--audit "$RUNNER_TEMP/release-notes-audit.json")
          go run ./scripts/releasenotes "${args[@]}"

  resolve_platforms:
    name: Resolve release platform matrices
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release: ${{ steps.release.outputs.matrix }}
      container: ${{ steps.container.outputs.matrix }}
      homebrew: ${{ steps.homebrew.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve release platforms
        id: release
        shell: bash
        run: go run ./tools/platformmatrix --capability release --github-output "$GITHUB_OUTPUT"
      - name: Resolve container platforms
        id: container
        shell: bash
        run: go run ./tools/platformmatrix --capability container --github-output "$GITHUB_OUTPUT"
      - name: Resolve Homebrew platforms
        id: homebrew
        shell: bash
        run: go run ./tools/platformmatrix --capability homebrew --github-output "$GITHUB_OUTPUT"

  build:
    name: Verify ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [validate, resolve_platforms]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    # Git for Windows 会按 runner 默认值把 tag 源码转为 CRLF；格式门必须检查 Git
    # blob 的 LF 字节，不能把 checkout 转换误报为未执行 gofmt。
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve_platforms.outputs.release) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false

      - name: Require the immutable native source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$(go env GOOS)" = '${{ matrix.goos }}'
          test "$(go env GOARCH)" = '${{ matrix.goarch }}'

      - name: Check Go formatting
        shell: bash
        run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"

      - name: Test Go sources
        shell: bash
        run: go test ./... -count=1

      - name: Test Go sources with the race detector
        if: contains(matrix.capabilities, 'race')
        shell: bash
        run: go test -race ./... -count=1

      - name: Vet Go sources
        shell: bash
        run: go vet ./...

      - name: Test release packaging
        shell: bash
        run: sh scripts/test-package-release.sh

  # 在全新 runner 上从同一不可变 tag 重建。测试 job 的临时状态不会进入发布产物。
  build_production:
    name: Build production ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [validate, resolve_platforms, build]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    # 生产构建也固定 checkout 的行尾，使所有平台从同一 tag 字节重建资产。
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve_platforms.outputs.release) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false

      - name: Build and package only the immutable release source
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          release_date=$(sed -n '1p' "changelog/v${VERSION}/en.md" | grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2}' | head -1)
          test -n "$release_date"
          archive=$(sh scripts/build-platform.sh \
            --version "$VERSION" \
            --release-date "$release_date" \
            --target '${{ matrix.goos }}/${{ matrix.goarch }}' \
            --output-dir dist)
          test -f "$archive"

      - name: Smoke the exact production package
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p smoke
          archive="dist/javdb-cli_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          smoked_binary='smoke/javdb'
          if [ '${{ matrix.goos }}' = windows ]; then
            7z x "${archive}.zip" -osmoke
            smoked_binary='smoke/javdb.exe'
          else
            tar -xzf "${archive}.tar.gz" -C smoke
          fi
          test -f "$smoked_binary"
          "$smoked_binary" --version | grep -F "javdb version ${VERSION} ("

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release-${{ matrix.artifact }}
          path: dist/javdb-cli_*
          if-no-files-found: error
          retention-days: 1

  verify_release_source:
    name: Verify release source trust
    needs: build_production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.trust.outputs.commit }}
      version: ${{ steps.trust.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false

      - name: Require the tag commit on the default release branch
        id: trust
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          go run ./tools/release verify-source --tag "$RELEASE_TAG" --default-branch "$DEFAULT_BRANCH" --github-output "$GITHUB_OUTPUT"

  prepare_release:
    name: Prepare release materials
    needs: [validate, verify_release_source, release_notes_audit, build_container]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: verified-release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: verified-container-*
          path: containers
          merge-multiple: true
      - name: Require the complete registry-defined release artifact set
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          go run ./tools/release verify-artifact-set --dir dist --version "$VERSION"
          go run ./tools/release verify-container-set --dir containers
          go run ./tools/release checksums --dir dist --version "$VERSION" --output dist/checksums.txt
          test -s dist/checksums.txt

      # §14/§15：这里一次性固化 build-once 产物的 identity 与 checksum。所有
      # downstream publisher 只消费这份 immutable handoff，不再自行构建或推断。
      - name: Write the immutable release handoff
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TAG_COMMIT: ${{ needs.verify_release_source.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          go run ./tools/release write-handoff \
            --repository "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --workflow 'Release' \
            --tag "$RELEASE_TAG" \
            --commit-sha "$TAG_COMMIT" \
            --version "$VERSION" \
            --dist-dir dist \
            --container-dir containers \
            --output release/release-handoff.json
          go run ./tools/release verify-handoff-set \
            --handoff release/release-handoff.json \
            --dist-dir dist \
            --container-dir containers \
            --repository "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --tag "$RELEASE_TAG"

      - name: Render release notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          go run ./scripts/releasenotes render \
            --version "${RELEASE_TAG#v}" \
            --dir "changelog/v${RELEASE_TAG#v}" \
            --output release/release-notes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prepared-release-metadata
          path: |
            dist/checksums.txt
            release/release-handoff.json
            release/release-notes.md
          if-no-files-found: error
          retention-days: 90

  approve_release:
    name: Approve release publication
    needs: [prepare_release, verify_homebrew_formula]
    runs-on: ubuntu-24.04
    environment: release-approval
    permissions: {}
    steps:
      - name: Approve the already prepared release
        shell: bash
        run: echo "Release materials are prepared and verified."

  publish:
    name: Publish release and container images
    needs: [validate, approve_release, prepare_release, build_container, verify_homebrew_formula]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: verified-release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prepared-release-metadata
          path: prepared
      - name: Restore prepared release metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp prepared/release/release-notes.md release/release-notes.md
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: verified-container-*
          path: containers
          merge-multiple: true

      # §18/§19：publish 只消费 preparation 阶段固化的 handoff，并重新校验
      # 每个产物的 checksum。这里不构建任何产物，也不从 tag 名推断 identity。
      - name: Verify the immutable release handoff
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          go run ./tools/release verify-handoff-set \
            --handoff prepared/release/release-handoff.json \
            --dist-dir dist \
            --container-dir containers \
            --checksums prepared/dist/checksums.txt \
            --repository "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --tag "$RELEASE_TAG"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: staging-homebrew-formula
          path: staging-formula

      - name: Sign the already prepared release archives
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          JAVDB_RELEASE_ED25519_PRIVATE_KEYS: ${{ secrets.JAVDB_RELEASE_ED25519_PRIVATE_KEYS }}
        run: |
          set -euo pipefail
          go run ./tools/release verify-artifact-set --dir dist --version "$VERSION"
          release_date=$(sed -n '1p' "changelog/v${VERSION}/en.md" | grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2}' | head -1)
          test -n "$release_date"
          go run ./scripts/sign-release \
            --version "$VERSION" \
            --release-date "$release_date" \
            --dir dist \
            --output dist \
            --checksums dist/checksums.txt
          cmp prepared/dist/checksums.txt dist/checksums.txt
          test -s dist/release-manifest.json
          test -s dist/release-manifest.sig

      - name: Create and verify the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file release/release-notes.md \
              dist/javdb-cli_*.tar.gz \
              dist/javdb-cli_*.zip \
              dist/checksums.txt \
              dist/release-manifest.json \
              dist/release-manifest.sig
          fi
          expected=$(find dist -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)
          actual=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          test "$actual" = "$expected"

      - name: Load the verified container images
        shell: bash
        run: |
          set -euo pipefail
          go run ./tools/release verify-container-set --dir containers
          for archive in containers/javdb-cli-*.tar; do
            docker load --input "$archive"
          done

      - name: Log in to the GHCR
        uses: docker/login-action@e92390c5fb421da1463c202d546fed0ec5c39f20
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@e92390c5fb421da1463c202d546fed0ec5c39f20
        with:
          registry: docker.io
          username: flanchanxwo
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Publish registry-defined container images and manifests
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/ghcr-container-refs"
          : > "$RUNNER_TEMP/dockerhub-container-refs"
          for archive in containers/javdb-cli-*.tar; do
            artifact=$(basename "$archive" .tar)
            artifact="${artifact#javdb-cli-}"
            image="javdb-cli:${RELEASE_TAG}-${artifact}"
            ghcr_ref="ghcr.io/flanchanxwo/javdb-cli:${RELEASE_TAG}-${artifact}"
            dockerhub_ref="flanchanxwo/javdb-cli:${RELEASE_TAG}-${artifact}"
            docker tag "$image" "$ghcr_ref"
            docker push "$ghcr_ref"
            docker tag "$image" "$dockerhub_ref"
            docker push "$dockerhub_ref"
            printf '%s\n' "$ghcr_ref" >> "$RUNNER_TEMP/ghcr-container-refs"
            printf '%s\n' "$dockerhub_ref" >> "$RUNNER_TEMP/dockerhub-container-refs"
          done
          mapfile -t ghcr_refs < "$RUNNER_TEMP/ghcr-container-refs"
          mapfile -t dockerhub_refs < "$RUNNER_TEMP/dockerhub-container-refs"
          test "${#ghcr_refs[@]}" -gt 0
          test "${#ghcr_refs[@]}" = "${#dockerhub_refs[@]}"
          docker manifest create "ghcr.io/flanchanxwo/javdb-cli:${RELEASE_TAG}" "${ghcr_refs[@]}"
          docker manifest push "ghcr.io/flanchanxwo/javdb-cli:${RELEASE_TAG}"
          docker manifest create "flanchanxwo/javdb-cli:${RELEASE_TAG}" "${dockerhub_refs[@]}"
          docker manifest push "flanchanxwo/javdb-cli:${RELEASE_TAG}"

      - name: Promote latest only for the newest stable tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_stable_tag=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
            --jq '.[].ref | sub("refs/tags/"; "")' \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | sort -V | tail -n 1)
          if [ "$RELEASE_TAG" = "$latest_stable_tag" ]; then
            mapfile -t ghcr_refs < "$RUNNER_TEMP/ghcr-container-refs"
            mapfile -t dockerhub_refs < "$RUNNER_TEMP/dockerhub-container-refs"
            docker manifest create "ghcr.io/flanchanxwo/javdb-cli:latest" "${ghcr_refs[@]}"
            docker manifest push "ghcr.io/flanchanxwo/javdb-cli:latest"
            docker manifest create "flanchanxwo/javdb-cli:latest" "${dockerhub_refs[@]}"
            docker manifest push "flanchanxwo/javdb-cli:latest"
          else
            printf 'Skipping latest promotion: %s is not the newest stable tag (%s)\n' \
              "$RELEASE_TAG" "$latest_stable_tag"
          fi

      - name: Verify the Docker Hub manifest is public
        shell: bash
        run: |
          set -euo pipefail
          docker logout docker.io
          docker manifest inspect "docker.io/flanchanxwo/javdb-cli:${RELEASE_TAG}" >/dev/null

      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Prepare the exact Homebrew formula commit
        if: vars.HOMEBREW_TAP_DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat staging-formula/formula-name)" = javdb-cli
          test -f staging-formula/javdb-cli.rb
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          git clone https://github.com/FlanChanXwO/homebrew-tap.git "$tap_dir"
          git -C "$tap_dir" config user.name github-actions[bot]
          git -C "$tap_dir" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p "$tap_dir/Formula"
          cp staging-formula/javdb-cli.rb "$tap_dir/Formula/javdb-cli.rb"
          git -C "$tap_dir" add -- Formula/javdb-cli.rb
          test "$(git -C "$tap_dir" diff --cached --name-only)" = Formula/javdb-cli.rb
          git -C "$tap_dir" commit -m "$RELEASE_TAG: update javdb-cli formula"

      - name: Push the verified Homebrew formula
        if: vars.HOMEBREW_TAP_DEPLOY_ENABLED == 'true'
        shell: bash
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOMEBREW_TAP_DEPLOY_KEY"
          umask 077
          key_path="$RUNNER_TEMP/homebrew-tap-deploy-key"
          trap 'rm -f "$key_path"' EXIT HUP INT TERM
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$key_path"
          chmod 600 "$key_path"
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          git -C "$tap_dir" remote set-url origin git@github.com:FlanChanXwO/homebrew-tap.git
          GIT_SSH_COMMAND="ssh -i $key_path -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/templates/homebrew/github.com-known-hosts" \
            git -C "$tap_dir" push origin HEAD:main

      # ClawHub 发布 workflow 只信任这个由已公开 Release 生成的 tag handoff；
      # 不从 workflow_run 的 head_branch 推断版本，也不重新读取 main。
      - name: Hand off the immutable release tag to ClawHub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clawhub-release-tag
          printf '%s\n' "$RELEASE_TAG" > clawhub-release-tag/release-tag

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clawhub-release-tag
          path: clawhub-release-tag/release-tag
          if-no-files-found: error
          retention-days: 1

  build_container:
    name: Build container ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [validate, resolve_platforms, build]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve_platforms.outputs.container) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false

      - name: Require the immutable container source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Rebuild the versioned Linux binary
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          release_date=$(sed -n '1p' "changelog/v${VERSION}/en.md" | grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2}' | head -1)
          test -n "$release_date"
          sh scripts/build-release.sh \
            --version "$VERSION" \
            --release-date "$release_date" \
            --target 'linux/${{ matrix.goarch }}' \
            --output dist/javdb

      - name: Build the verified container image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg REVISION="$(git rev-parse "$RELEASE_TAG^{commit}")" \
            --build-arg VERSION="$RELEASE_TAG" \
            --platform "linux/${{ matrix.goarch }}" \
            --tag "javdb-cli:${RELEASE_TAG}-${{ matrix.artifact }}" \
            .

      - name: Verify image provenance and runtime contract
        shell: bash
        env:
          IMAGE: javdb-cli:${{ env.RELEASE_TAG }}-${{ matrix.artifact }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id "$IMAGE" -u)
          test "$uid" != 0
          release_date=$(sed -n '1p' "changelog/v${VERSION}/en.md" | grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2}' | head -1)
          test -n "$release_date"
          docker run --rm "$IMAGE" --version | grep -F "javdb version ${VERSION} (${release_date})"
          docker run --rm "$IMAGE" config path | grep -F '/home/javdb/.javdb-cli/'
          test "$(docker run --rm --entrypoint sh "$IMAGE" -c 'pwd')" = /work
          docker run --rm --entrypoint sh "$IMAGE" -c \
            'test -s /usr/share/doc/javdb-cli/LICENSE'
          revision=$(git rev-parse "$RELEASE_TAG^{commit}")
          docker image inspect "$IMAGE" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            | grep -Fx "$revision"
          docker image inspect "$IMAGE" \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
            | grep -Fx "$RELEASE_TAG"
          docker image inspect "$IMAGE" \
            --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' \
            | grep -Fx 'https://github.com/FlanChanXwO/javdb-cli'
          docker image inspect "$IMAGE" \
            --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' \
            | grep -Fx 'MIT'

      - name: Export the verified image artifact
        shell: bash
        run: docker save --output "${RUNNER_TEMP}/javdb-cli-${{ matrix.artifact }}.tar" "javdb-cli:${RELEASE_TAG}-${{ matrix.artifact }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-container-${{ matrix.artifact }}
          path: ${{ runner.temp }}/javdb-cli-${{ matrix.artifact }}.tar
          if-no-files-found: error
          # 保留足够久以便恢复已发布镜像；镜像引用 git 存储（不是依赖重新构建的易失资产）。
          retention-days: 90

  render_homebrew_formula:
    name: Render Homebrew formula
    needs: [validate, prepare_release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prepared-release-metadata
          path: prepared-release

      - name: Render the formula from prepared checksums
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p staging-formula
          bash scripts/render-homebrew-formula.sh \
            --version "$VERSION" \
            --checksums prepared-release/dist/checksums.txt \
            --output staging-formula/javdb-cli.rb
          printf '%s\n' javdb-cli > staging-formula/formula-name

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-homebrew-formula
          path: staging-formula
          if-no-files-found: error
          retention-days: 1

  verify_homebrew_formula:
    name: Verify Homebrew on ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [render_homebrew_formula, resolve_platforms]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve_platforms.outputs.homebrew) }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: staging-homebrew-formula
          path: staging-formula

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-${{ matrix.artifact }}
          path: release-assets

      - name: Install the prepared archive through the staging formula
        shell: bash
        run: |
          set -euo pipefail
          formula_name=$(cat staging-formula/formula-name)
          test "$formula_name" = javdb-cli
          test "$(find staging-formula -maxdepth 1 -type f -print | LC_ALL=C sort)" = "$(printf '%s\n%s\n' staging-formula/formula-name staging-formula/javdb-cli.rb | LC_ALL=C sort)"
          version="${RELEASE_TAG#v}"
          archive="javdb-cli_${version}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          test -f "release-assets/$archive"
          public_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$archive"
          grep -F "url \"$public_url\"" staging-formula/javdb-cli.rb >/dev/null
          cp staging-formula/javdb-cli.rb staging-formula/javdb-cli-verify.rb
          if [ '${{ matrix.goos }}' = linux ]; then
            staging_dir="$(pwd)/staging-formula"
            assets_dir="$(pwd)/release-assets"
            sed -i "s|$public_url|file:///release-assets/$archive|g" staging-formula/javdb-cli-verify.rb
            docker run --rm \
              --mount "type=bind,src=$staging_dir,dst=/staging-formula,readonly" \
              --mount "type=bind,src=$assets_dir,dst=/release-assets,readonly" \
              --env RELEASE_TAG \
              --env HOMEBREW_NO_AUTO_UPDATE=1 \
              --env HOMEBREW_NO_ENV_HINTS=1 \
              --entrypoint bash \
              homebrew/brew@sha256:b0072bfdebf5934ae24b93b44a1928a88057399b3283ffa0177bb86084fdedfd \
              -euo pipefail -c '
                brew tap-new javdb-cli-release/staging --no-git
                tap_dir="$(brew --repository)/Library/Taps/javdb-cli-release/homebrew-staging"
                cp /staging-formula/javdb-cli-verify.rb "$tap_dir/Formula/javdb-cli.rb"
                brew install --formula javdb-cli-release/staging/javdb-cli
                javdb --version | grep -F "javdb version ${RELEASE_TAG#v} ("
              '
          else
            sed -i '' "s|$public_url|file://$(pwd)/release-assets/$archive|g" staging-formula/javdb-cli-verify.rb
            brew tap-new javdb-cli-release/staging --no-git
            brew trust --tap javdb-cli-release/staging
            tap_dir="$(brew --repository)/Library/Taps/javdb-cli-release/homebrew-staging"
            cp staging-formula/javdb-cli-verify.rb "$tap_dir/Formula/javdb-cli.rb"
            brew install --formula javdb-cli-release/staging/javdb-cli
            javdb --version | grep -F "javdb version ${RELEASE_TAG#v} ("
          fi
