name: Classify change scope
description: Classify a Git diff with the repository's strict documentation allowlist.

inputs:
  base-sha:
    description: Base commit for the diff.
    required: false
  head-sha:
    description: Head commit for the diff.
    required: true

outputs:
  docs_only:
    description: Whether every changed path is in the documentation-only allowlist.
    value: ${{ steps.scope.outputs.docs_only }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version-file: go.mod
        cache: true

    - name: Detect documentation-only changes
      id: scope
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        set -euo pipefail
        if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
          printf '%s\n' 'docs_only=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        go run ./scripts/changescope --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
